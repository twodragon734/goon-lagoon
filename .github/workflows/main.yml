name: Build mod from zip
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the project zip
        run: unzip -q -o magic-wand.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build the mod
        working-directory: magic-wand
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: magic-wand-mod
          path: |
            magic-wand/build/libs/*.jar
            !magic-wand/build/libs/*-sources.jar
